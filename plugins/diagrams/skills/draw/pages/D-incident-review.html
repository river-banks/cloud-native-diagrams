<!doctype html>
<!--LANG-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--TITLE--></title>
<style>
/* Layout D, Incident review (Blog). A status strip, then a small locator of the whole drawing (only to find the
   place, marked as a locator, never the reading copy), then the timeline on the left driving a full-size crop
   of the drawing on the right. A wide drawing is never squeezed: it is either the locator or a readable crop.
   After: street-map locator insets; a summary-then-figure postmortem. */
/*FONTS*/
@theme light { --bg:#fcfcfa; --paper:#ffffff; --ink:#1c1d19; --muted:#5b5d55; --rule:#e2e3dc; --accent:#55650f; --bad:#b42318; }
@theme dark { --bg:#141512; --paper:#1b1c18; --ink:#e8e9e3; --muted:#a2a59a; --rule:#33352e; --accent:#b9cc62; --bad:#ff7b72; }
/*DGCSS*/
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg); color:var(--ink); font:17px/1.6 var(--body)}
a{color:var(--accent)}
.g{max-width:1320px; margin:0 auto; padding-inline:max(16px, env(safe-area-inset-left,0px))}
.bar{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; font:500 14px/1.3 var(--head); color:var(--muted); padding-block:18px 0}
header{padding-block:22px 0}
h1{font:700 clamp(30px,4vw,44px)/1.1 var(--body); margin:0 0 14px; letter-spacing:-.01em; text-wrap:balance}
.sum{font-size:20px; line-height:1.5; max-width:66ch; margin:0 0 22px}
.strip{display:flex; flex-wrap:wrap; border:1px solid var(--rule); border-radius:4px; background:var(--paper); font-size:14px; line-height:1.3}
.strip div{padding:12px 18px; border-right:1px solid var(--rule); flex:1 1 150px}
.strip div:last-child{border-right:0}
.strip span{display:block; color:var(--muted); font-size:13px}
.strip b{font-size:17px; font-weight:600; font-variant-numeric:tabular-nums}
.strip .imp b{color:var(--bad)}
h2{font:700 24px/1.2 var(--body); margin:42px 0 12px}
.locator{position:relative; background:var(--dg-ground); border:1px solid var(--rule); border-radius:4px; padding:6px; max-width:760px}
.locator .dg{--dg-min:0; width:100%; opacity:.9}
.frame{position:absolute; border:3px solid var(--bad); border-radius:3px; pointer-events:none; transition:all .35s ease}
.lcap{font-size:13px; color:var(--muted); margin:6px 0 0}
.tl{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:32px; align-items:start; margin-top:18px}
ol.times{list-style:none; margin:0; padding:0; border-left:2px solid var(--rule)}
.times li{position:relative; padding:0 0 0 22px; margin:0 0 6px}
.times button{all:unset; display:block; cursor:pointer; padding:10px 12px; border-radius:4px; width:100%; box-sizing:border-box}
.times button:focus-visible{outline:3px solid var(--accent)}
.times li::before{content:""; position:absolute; left:-7px; top:18px; width:12px; height:12px; border-radius:50%; background:var(--bg); border:2px solid var(--muted)}
.times li.imp::before{border-color:var(--bad); background:var(--bad)}
.times time{font:500 14px/1 var(--mono); color:var(--muted); display:block; margin-bottom:4px}
.times b{font:600 16.5px/1.35 var(--body); display:block}
.times p{margin:4px 0 0; font-size:15.5px; line-height:1.5}
.times li.on button{background:var(--paper); box-shadow:inset 3px 0 0 var(--accent)}
.times li.on time{color:var(--accent)}
.detail{position:sticky; top:16px}
.detail .fig{border:1px solid var(--rule); border-radius:4px}
.dcap{font-size:14px; color:var(--muted); margin:8px 0 0; min-height:3em}
.dcap b{color:var(--ink)}
.prose{max-width:66ch}
code{font:.9em var(--mono)}
footer{border-top:1px solid var(--rule); margin-top:40px; padding-block:20px 70px; font-size:14px; color:var(--muted)}
@media (max-width:900px){ .tl{grid-template-columns:1fr} .detail{position:static; order:-1} }
</style>
</head>
<body>
<div class="g bar"><span><!--CRUMB--></span><!--TOGGLE--></div>
<header class="g">
  <h1><!--TITLE--></h1>
  <p class="sum"><!--ANSWER--></p>
  <div class="strip" id="strip"></div>
</header>
<section class="g">
  <h2>Where it happened</h2>
  <div class="locator" id="loc" aria-hidden="true" data-locator><!--FIG:lo--><div class="frame" id="frame"></div></div>
  <p class="lcap">The whole drawing, small, only to find the place. The red frame is the part drawn full size beside the timeline.</p>
  <h2>Timeline</h2>
  <div class="tl">
    <ol class="times" id="times"></ol>
    <div class="detail">
      <div class="fig dg-scroll" tabindex="0" aria-label="The part of the drawing for the selected time, at full size"><!--FIG:de--></div>
      <p class="dcap" id="dcap"></p>
    </div>
  </div>
  <div id="more"></div>
  <footer><!--CAPTION--> <!--META--></footer>
</section>
<script>
/*DGJS*/
(function () {
  const lo = document.querySelector('[data-dg="lo"]'), de = document.querySelector('[data-dg="de"]'), frame = document.getElementById('frame'), cap = document.getElementById('dcap');
  lo.dataset.locator = '';
  const facts = (PAGE.strip || PAGE.facts).slice(0, 5), imp = PAGE.impact;
  document.getElementById('strip').innerHTML = (imp ? [[imp[0], imp[1], 1]] : []).concat(facts).slice(0, 5).map(([k, v, bad]) => `<div${bad ? ' class="imp"' : ''}><span>${DG.esc(k)}</span><b>${DG.md(v)}</b></div>`).join('');
  document.getElementById('more').innerHTML = (PAGE.more || []).map(m => `<h2>${DG.md(m.h)}</h2><div class="prose">${[].concat(m.p).map(p => `<p>${DG.md(p)}</p>`).join('')}</div>`).join('');
  const T = PAGE.timeline, list = document.getElementById('times');
  list.innerHTML = T.map((t, i) => `<li data-i="${i}"${t.impact ? ' class="imp"' : ''}><button type="button"><time>${DG.esc(t.time)}</time><b>${DG.md(t.h)}</b>${t.p ? `<p>${DG.md(t.p)}</p>` : ''}</button></li>`).join('');
  const items = [...list.children];
  function place() {   // the red frame on the locator, where the detail's crop sits
    const vis = DG.shown(lo), dv = DG.shown(de).getAttribute('viewBox').split(' ').map(Number), lv = vis.getAttribute('viewBox').split(' ').map(Number);
    const r = vis.getBoundingClientRect(), pr = document.getElementById('loc').getBoundingClientRect(), k = r.width / lv[2];
    Object.assign(frame.style, { left: (r.left - pr.left + (dv[0] - lv[0]) * k) + 'px', top: (r.top - pr.top + (dv[1] - lv[1]) * k) + 'px', width: dv[2] * k + 'px', height: dv[3] * k + 'px' });
  }
  function pick(li) {
    items.forEach(x => x.classList.toggle('on', x === li));
    const t = T[+li.dataset.i], ns = t.nodes || [], es = t.edges || [];
    if (ns.length) DG.crop(de, ns, 44); else DG.uncrop(de);
    DG.light(de, { nodes: ns, edges: es }); DG.light(lo, { nodes: ns, edges: es });
    cap.innerHTML = `<b>${DG.esc(t.time)}</b> ${DG.md(t.h)}. Drawn full size.`;
    place();
  }
  items.forEach(li => li.querySelector('button').addEventListener('click', () => { pick(li); if (matchMedia('(max-width:900px)').matches) document.querySelector('.detail').scrollIntoView({ block: 'start' }); }));
  addEventListener('resize', place); document.addEventListener('dg-theme', place);
  if (items.length) { pick(items[0]); document.fonts.ready.then(place); }
})();
</script>
</body>
</html>
