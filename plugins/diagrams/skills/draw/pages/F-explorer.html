<!doctype html>
<!--LANG-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--TITLE--></title>
<style>
/* Layout F, Explorer (Wiki). The drawing is never shrunk to fit: it sits at full size in a pannable canvas, and
   the panel beside it answers "what is this box?" from the model itself (where it runs, what it receives and
   sends). "Whole map" is a choice the reader makes, never the default. A table lists every box.
   After: transit network maps with a station panel. */
/*FONTS*/
@theme light { --bg:#fbfbf9; --panel:#ffffff; --ink:#1e1c17; --muted:#5f5b51; --rule:#e2dfd6; --accent:#7d5a00; }
@theme dark { --bg:#15140f; --panel:#1c1b16; --ink:#ebe8df; --muted:#a8a396; --rule:#36342c; --accent:#e6b94a; }
/*DGCSS*/
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg); color:var(--ink); font:17px/1.55 var(--body)}
a{color:var(--accent)}
.g{padding-inline:max(16px, env(safe-area-inset-left,0px))}
.bar{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; font:500 14px/1.3 var(--head); color:var(--muted); padding-block:18px 0}
header{display:flex; justify-content:space-between; align-items:end; gap:24px; flex-wrap:wrap; padding-block:16px 18px}
h1{font:700 clamp(30px,3.6vw,42px)/1.1 var(--head); margin:0 0 8px}
.lead{margin:0; max-width:78ch; font-size:18px}
.facts{display:flex; gap:22px; font-size:14px; color:var(--muted); flex-wrap:wrap}
.facts b{display:block; color:var(--ink); font-size:16px; font-weight:600}
.ex{display:grid; grid-template-columns:minmax(0,1fr) 360px; border-block:1px solid var(--rule); background:var(--panel)}
.canvas{position:relative; overflow:auto; height:min(72vh,680px); background:var(--dg-ground); cursor:grab; outline:none}
.canvas.drag{cursor:grabbing}
.canvas:focus-visible{box-shadow:inset 0 0 0 3px var(--accent)}
.canvas .dg{--dg-min:1; width:calc(var(--dw) * 1px); margin:0}
.fit .canvas{overflow:hidden} .fit .canvas .dg{--dg-min:0; width:100%}
.dg .node{cursor:pointer}
.dg .node.sel > rect,.dg .node.sel > path{stroke:var(--accent); stroke-width:3}
.tools{position:sticky; left:0; top:0; display:flex; gap:8px; padding:10px; z-index:2; width:max-content}
.tools button{font:600 14px/1 var(--body); color:var(--ink); background:var(--panel); border:1px solid var(--rule); border-radius:4px; padding:8px 11px; cursor:pointer}
.tools button[aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--accent)}
.side{border-left:1px solid var(--rule); padding:18px 20px; overflow:auto; height:min(72vh,680px)}
.side .kind{font-size:14px; color:var(--muted); margin:0}
.side h2{font:700 26px/1.15 var(--head); margin:2px 0 8px}
.side p{margin:0 0 12px; font-size:16px}
.side h3{font:700 15px/1.3 var(--body); margin:16px 0 6px}
.side ul{list-style:none; margin:0; padding:0}
.side li{border-top:1px solid var(--rule); padding:7px 0; font-size:15px; display:grid; grid-template-columns:1fr auto; gap:10px}
.side li button{all:unset; cursor:pointer; color:var(--accent); font-weight:600}
.side li button:focus-visible{outline:2px solid var(--accent)}
.side li span{font-size:13.5px; color:var(--muted); text-align:right}
.side dl{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; margin:0; font-size:15px}
.side dt{color:var(--muted)} .side dd{margin:0; font-weight:600}
.hint{font-size:14px; color:var(--muted); padding-block:8px 0}
h2.s{font:700 24px/1.2 var(--head); margin:34px 0 10px}
.tw{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:15.5px}
th{text-align:left; padding:8px 14px 8px 0; border-bottom:2px solid var(--ink); white-space:nowrap}
td{padding:9px 14px 9px 0; border-bottom:1px solid var(--rule)}
td:first-child{padding-left:10px}
tbody tr{cursor:pointer} tbody tr.on td:first-child{box-shadow:inset 4px 0 0 var(--accent)} tbody tr:hover td{background:var(--panel)}
code{font-family:var(--mono)}
.foot{color:var(--muted); font-size:14px; padding-block:24px 70px}
@media (max-width:980px){ .ex{grid-template-columns:1fr} .side{border-left:0; border-top:1px solid var(--rule); height:auto} .canvas{height:60vh} }
</style>
</head>
<body>
<div class="g bar"><span><!--CRUMB--></span><!--TOGGLE--></div>
<header class="g">
  <div><h1><!--TITLE--></h1><p class="lead"><!--ANSWER--></p></div>
  <div class="facts" id="facts"></div>
</header>
<section class="ex" id="ex">
  <div class="canvas" id="canvas" tabindex="0" aria-label="The drawing at full size. Drag or scroll to move around.">
    <div class="tools"><button type="button" id="b100" aria-pressed="true">Full size</button><button type="button" id="bfit" aria-pressed="false">Whole map</button></div>
    <!--FIG:main-->
  </div>
  <aside class="side" id="side" aria-live="polite"></aside>
</section>
<p class="hint g">Full size keeps every label readable: drag the drawing or use the scroll bars. Whole map shows the shape, but its labels are too small to read. Pick any box to see what it is.</p>
<main class="g">
  <h2 class="s">Every part</h2>
  <div class="tw"><table><thead><tr><th>Box</th><th>Where</th><th>Does</th><th id="ownh">Owner</th></tr></thead><tbody id="rows"></tbody></table></div>
  <div id="more"></div>
  <p class="foot"><!--CAPTION--> <!--META--></p>
</main>
<script>
/*DGJS*/
(function () {
  const dg = document.querySelector('.dg'), canvas = document.getElementById('canvas'), side = document.getElementById('side'), ex = document.getElementById('ex');
  const OWN = PAGE.owners || {}, NOTE = PAGE.notesById || {}, hasOwn = Object.keys(OWN).length > 0;
  const Z = Object.fromEntries((MODEL.zones || []).map(z => [z.id, z])), N = Object.fromEntries(MODEL.nodes.map(n => [n.id, n]));
  const inside = (n, z) => n.x >= z.x && n.y >= z.y && n.x + n.w <= z.x + z.w && n.y + n.h <= z.y + z.h;
  const zoneOf = n => n.in ? Z[n.in] : (MODEL.zones || []).filter(z => inside(n, z)).sort((a, b) => a.w * a.h - b.w * b.h)[0];
  const parent = z => z.in ? Z[z.in] : (MODEL.zones || []).filter(o => o !== z && inside(z, o)).sort((a, b) => a.w * a.h - b.w * b.h)[0];
  const where = n => { const out = []; let z = zoneOf(n); while (z) { out.push(z.t); z = parent(z); } return out.reverse().join(' / ') || 'Outside every zone'; };
  const at = (pts, n) => pts && pts.length && n.x !== undefined && pts[0] >= n.x - 4 && pts[0] <= n.x + n.w + 4 && pts[1] >= n.y - 4 && pts[1] <= n.y + n.h + 4;
  const ends = e => [e.from || (MODEL.nodes.find(n => at((e.pts || [])[0], n)) || {}).id, e.to || (MODEL.nodes.find(n => at((e.pts || []).slice(-1)[0], n)) || {}).id];
  const E = MODEL.edges.map((e, i) => { const [a, b] = ends(e); return { a, b, i, l: [].concat(e.l || []).join(', ') }; });
  document.getElementById('facts').innerHTML = PAGE.facts.slice(0, 4).map(([k, v]) => `<div>${DG.esc(k)}<b>${DG.md(v)}</b></div>`).join('');
  document.getElementById('more').innerHTML = (PAGE.more || []).map(m => `<h2 class="s">${DG.md(m.h)}</h2>${[].concat(m.p).map(p => `<p>${DG.md(p)}</p>`).join('')}`).join('');
  if (!hasOwn) document.getElementById('ownh').remove();
  function select(id, scroll) {
    const n = N[id]; if (!n) return;
    const ins = E.filter(e => e.b === id && e.a), outs = E.filter(e => e.a === id && e.b);
    const li = (e, other) => `<li><button type="button" data-go="${other}">${DG.esc(N[other].t)}</button><span>${DG.esc(e.l)}</span></li>`;
    const tag = n.tag && MODEL.tags && MODEL.tags[n.tag];
    side.innerHTML = `<p class="kind">${DG.esc(where(n))}</p><h2>${DG.esc(n.t)}</h2><p>${DG.esc((n.s || []).join('. '))}${n.ghost ? ' (planned)' : ''}${(n.s || []).length ? '.' : ''}</p>
      ${NOTE[id] ? `<p>${DG.md(NOTE[id])}</p>` : ''}
      <dl>${tag ? `<dt>Status</dt><dd>${DG.esc(tag.t)}${tag.m ? `: ${DG.esc(tag.m)}` : ''}</dd>` : ''}${OWN[id] ? `<dt>Owner</dt><dd>${DG.esc(OWN[id])}</dd>` : ''}</dl>
      ${ins.length ? `<h3>Receives from</h3><ul>${ins.map(e => li(e, e.a)).join('')}</ul>` : ''}
      ${outs.length ? `<h3>Sends to</h3><ul>${outs.map(e => li(e, e.b)).join('')}</ul>` : ''}`;
    side.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => select(b.dataset.go, true)));
    DG.light(dg, { nodes: [id, ...ins.map(e => e.a), ...outs.map(e => e.b)], edges: [...ins, ...outs].map(e => e.i) });
    dg.querySelectorAll('.node').forEach(g => g.classList.toggle('sel', g.dataset.id === id));
    document.querySelectorAll('#rows tr').forEach(r => r.classList.toggle('on', r.dataset.id === id));
    if (scroll && !ex.classList.contains('fit')) DG.reveal(dg, canvas, id);
  }
  document.getElementById('rows').innerHTML = MODEL.nodes.map(n => `<tr data-id="${DG.esc(n.id)}" tabindex="0"><td><b>${DG.esc(n.t)}</b></td><td>${DG.esc(where(n))}</td><td>${DG.esc((n.s || []).join(', '))}</td>${hasOwn ? `<td>${DG.esc(OWN[n.id] || '')}</td>` : ''}</tr>`).join('');
  document.querySelectorAll('#rows tr').forEach(r => { const go = () => { select(r.dataset.id, true); ex.scrollIntoView({ block: 'nearest' }); }; r.addEventListener('click', go); r.addEventListener('keydown', e => { if (e.key === 'Enter') go(); }); });
  let down = null, moved = false;
  dg.querySelectorAll('.node').forEach(g => g.addEventListener('click', () => { if (!moved) select(g.dataset.id, false); }));
  canvas.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; down = { x: e.clientX, y: e.clientY, l: canvas.scrollLeft, t: canvas.scrollTop }; moved = false; });
  addEventListener('pointermove', e => { if (!down) return; const dx = e.clientX - down.x, dy = e.clientY - down.y; if (Math.abs(dx) + Math.abs(dy) > 4) { moved = true; canvas.classList.add('drag'); } canvas.scrollLeft = down.l - dx; canvas.scrollTop = down.t - dy; });
  addEventListener('pointerup', () => { down = null; canvas.classList.remove('drag'); setTimeout(() => moved = false, 0); });
  const b100 = document.getElementById('b100'), bfit = document.getElementById('bfit');
  const first = PAGE.start || (MODEL.nodes.find(n => n.hero) || MODEL.nodes.find(n => n.tag) || MODEL.nodes[0]).id;
  function mode(fit) { ex.classList.toggle('fit', fit); b100.setAttribute('aria-pressed', String(!fit)); bfit.setAttribute('aria-pressed', String(fit)); if (!fit) select((dg.querySelector('.node.sel') || {}).dataset ? dg.querySelector('.node.sel').dataset.id : first, true); }
  b100.addEventListener('click', () => mode(false)); bfit.addEventListener('click', () => mode(true));
  select(first, false); requestAnimationFrame(() => select(first, true));
})();
</script>
</body>
</html>
