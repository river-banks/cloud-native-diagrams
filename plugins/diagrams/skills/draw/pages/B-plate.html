<!doctype html>
<!--LANG-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--TITLE--></title>
<style>
/* Layout B, Plate (Explainer). A printed plate: the drawing runs edge to edge, never under 85% of its drawn size,
   and each note sits directly over or under the numbered zone it explains, so the eye drops from the words onto
   the picture. Notes that would collide (or an isometric look, where zones are projected) fall back to a row of
   cards above the plate. After: printed map plates and museum wall labels. */
/*FONTS*/
@theme light { --bg:#ffffff; --plate:#f3f4f1; --ink:#1b1d1a; --muted:#585c55; --rule:#d6d8d1; --accent:#f2c200; --accentink:#1b1d1a; }
@theme dark { --bg:#141513; --plate:#1c1e1b; --ink:#e9eae5; --muted:#a3a79e; --rule:#34372f; --accent:#f2c200; --accentink:#141513; }
/*DGCSS*/
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg); color:var(--ink); font:17px/1.55 var(--body)}
a{color:inherit}
.g{padding-inline:max(16px, env(safe-area-inset-left,0px))}
.bar{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; font:600 14px/1.3 var(--head); color:var(--muted); padding-block:18px 0}
.head{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:48px; align-items:end; padding-block:26px 30px; max-width:1940px; margin:0 auto}
h1{font:800 clamp(38px,5.5vw,76px)/.95 var(--head); letter-spacing:-.01em; margin:0; text-wrap:balance}
.answer{font-size:20px; line-height:1.5; margin:0; max-width:60ch}
.legend{font:500 14px/1.4 var(--head); color:var(--muted); margin:10px 0 0}
.disc{display:inline-grid; place-items:center; min-width:30px; height:30px; border-radius:50%; background:var(--accent); color:var(--accentink); font:800 15px/1 var(--head); flex:none}
.plate{background:var(--plate); border-block:1px solid var(--rule); padding-block:18px}
.frame{width:max-content; min-width:100%; margin:0 auto}
.frame > *{width:max(100%, calc(var(--dw) * .85px)); max-width:calc(var(--dw) * 1px); margin-inline:auto}
.notes{position:relative; height:var(--nh, 0px)}
.note{position:absolute; top:0; padding:0 14px 0 0; display:flex; gap:10px}
.notes.below .note{top:14px}
.note h2{font:800 19px/1.15 var(--head); margin:3px 0 6px}
.note p{margin:0; font-size:15.5px; line-height:1.45}
.note.on h2,.note:hover h2,.note:focus-visible h2{text-decoration:underline; text-decoration-thickness:3px; text-decoration-color:var(--accent); text-underline-offset:4px}
.note{outline:none} .note:focus-visible{outline:3px solid var(--accent); outline-offset:4px}
.cards .notes{height:auto!important; display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:18px; padding-block:6px 18px}
.cards .note{position:static}
.cap{max-width:1940px; margin:0 auto; font:500 14px/1.4 var(--head); color:var(--muted); padding-block:10px 0}
.more{max-width:1940px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:40px; padding-block:40px 80px}
.more h2{font:800 22px/1.2 var(--head); margin:0 0 10px}
.more p{font-size:16px}
code{font:.9em var(--mono)}
@media (max-width:1180px){ .head{grid-template-columns:1fr; gap:18px} }
</style>
</head>
<body>
<div class="g bar"><span><!--CRUMB--></span><!--TOGGLE--></div>
<header class="head g">
  <h1><!--TITLE--></h1>
  <div>
    <p class="answer"><!--ANSWER--></p>
    <p class="legend" id="legend"></p>
  </div>
</header>
<section class="plate g" aria-label="Annotated diagram">
  <div class="dg-scroll" tabindex="0" aria-label="Diagram with notes, scrolls sideways on small screens" style="background:transparent">
    <div class="frame" id="frame">
      <div class="notes above" id="above"></div>
      <div class="dg-ground" style="background:var(--dg-ground); border:1px solid var(--rule)"><!--FIG:main--></div>
      <div class="notes below" id="below"></div>
    </div>
  </div>
  <p class="cap"><!--CAPTION--> <!--META--></p>
</section>
<section class="more g" id="more"></section>
<script>
/*DGJS*/
(function () {
  const dg = document.querySelector('.dg'), frame = document.getElementById('frame');
  frame.style.setProperty('--dw', dg.dataset.w);
  const Z = Object.fromEntries((MODEL.zones || []).map(z => [z.n, z]));
  const W = +dg.dataset.w, iso = document.documentElement.dataset.look === 'iso';
  const ys = PAGE.notes.map(n => (Z[n.n] || {}).y || 0), mid = (Math.min(...ys) + Math.max(...ys)) / 2;
  const notes = PAGE.notes.map((n, i) => {
    const z = Z[n.n], up = !z || z.y <= mid;
    return { n, i, up, left: z ? z.x / W * 100 : 0, width: z ? z.w / W * 100 : 20 };
  });
  // Notes sit over their zone only when no two in a row collide; otherwise they become cards.
  const clash = row => row.sort((a, b) => a.left - b.left).some((a, k) => row[k + 1] && a.left + a.width > row[k + 1].left + .5 || a.width < 11);
  const cards = iso || clash(notes.filter(x => x.up)) || clash(notes.filter(x => !x.up)) || notes.some(x => !Z[x.n.n]);
  if (cards) document.body.classList.add('cards');
  const card = x => `<div class="note" tabindex="0" data-i="${x.i}"${cards ? '' : ` style="left:${x.left}%; width:${x.width}%"`}><span class="disc">${DG.esc(x.n.n)}</span><div><h2>${DG.md(x.n.h)}</h2><p>${DG.md(x.n.p)}</p></div></div>`;
  document.getElementById('above').innerHTML = notes.filter(x => cards || x.up).map(card).join('');
  document.getElementById('below').innerHTML = cards ? '' : notes.filter(x => !x.up).map(card).join('');
  document.getElementById('legend').textContent = cards ? 'Each note has the number of its zone on the drawing. Point at a note to light up its zone.' : 'Each note sits over the zone with the same number on the drawing. Point at a note to light up its zone.';
  document.getElementById('more').innerHTML = (PAGE.more || []).map(m => `<div><h2>${DG.md(m.h)}</h2>${[].concat(m.p).map(p => `<p>${DG.md(p)}</p>`).join('')}</div>`).join('');
  document.querySelectorAll('.note').forEach(el => {
    const n = PAGE.notes[+el.dataset.i], on = () => { el.classList.add('on'); DG.light(dg, { nodes: n.nodes || [], edges: n.edges || [] }); }, off = () => { el.classList.remove('on'); DG.light(dg); };
    el.addEventListener('mouseenter', on); el.addEventListener('mouseleave', off); el.addEventListener('focus', on); el.addEventListener('blur', off);
  });
  const fit = () => ['above', 'below'].forEach(id => { const el = document.getElementById(id); el.style.setProperty('--nh', (el.children.length ? Math.max(...[...el.children].map(c => c.offsetHeight)) + 16 : 0) + 'px'); });
  addEventListener('resize', fit); document.fonts.ready.then(fit); fit();
})();
</script>
</body>
</html>
